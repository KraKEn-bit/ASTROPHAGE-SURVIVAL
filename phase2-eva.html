<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 2 - Eva and Mary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script async src="https://vibej.am/2026/widget.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }

    /* Pulse the panel edge only — keep text at full opacity for readability */
    @keyframes textPulse {
      0%,
      100% {
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.92),
          0 0 0 1px rgba(46, 213, 115, 0.35),
          0 0 14px rgba(46, 213, 115, 0.25);
        border-color: #2ed573;
      }
      50% {
        box-shadow:
          0 6px 28px rgba(0, 0, 0, 0.95),
          0 0 0 1px rgba(46, 213, 115, 0.6),
          0 0 22px rgba(46, 213, 115, 0.45);
        border-color: #5ef0a0;
      }
    }

    #spin-hint {
      position: fixed;
      z-index: 150;
      pointer-events: none;
      display: none;
      box-sizing: border-box;
      background: rgba(6, 10, 8, 0.94);
      border: 2px solid #2ed573;
      border-radius: 8px;
      color: #f0fff4;
      font-family: Orbitron, "Segoe UI", sans-serif;
      font-weight: 600;
      line-height: 1.45;
      letter-spacing: 0.03em;
      text-align: left;
      -webkit-font-smoothing: antialiased;
      animation: textPulse 1.8s ease-in-out infinite;
      /* Strong halation so glyphs never blend into foliage */
      text-shadow:
        0 0 1px #000,
        0 1px 2px #000,
        0 2px 8px rgba(0, 0, 0, 0.95);
    }

    #spin-hint .spin-hint-accent {
      color: #7dffb0;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="spin-hint">
    <span aria-hidden="true">💡</span>
    <strong>HINT:</strong> Skim past the <span class="spin-hint-accent">Green Astrophage</span>—that close—and
    <span class="spin-hint-accent">physics picks a new north</span>.
  </div>
  <div id="warning-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 5, 0.95); color: #ff003c; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; font-family: 'Courier New', Courier, monospace; text-align: center; padding: 20px;">
    <div style="border: 2px solid #ff003c; padding: 40px; max-width: 700px; box-shadow: 0 0 30px rgba(255, 0, 60, 0.3); background: #000;">
      <h1 style="text-shadow: 0 0 15px #ff003c; letter-spacing: 4px; animation: blink 1s infinite;">[ EVA TASK FORCE LOCKED ON ]</h1>
      <p id="pilot-warning" style="font-size: 1.2rem; line-height: 1.8; margin: 28px 0; color: #fff;"></p>
      <p style="color: #39ff14; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px;">[ PRESS ENTER TO DEPLOY ]</p>
    </div>
  </div>
  <style>@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }</style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="js/globals.js"></script>
  <script src="js/ScenePhase1.js"></script>
  <script src="js/SceneGameOver.js"></script>
  <script>
    const warningOverlay = document.getElementById("warning-overlay");
    const params = new URLSearchParams(window.location.search);
    const pilotName = params.get("username") || "UNKNOWN PILOT";
    const pilotWarningEl = document.getElementById("pilot-warning");
    if (pilotWarningEl) {
      pilotWarningEl.innerText = `Captain ${pilotName}, Commander Eva is in pursuit. Reach Mary and survive the highway assault.`;
    }

    const config = {
      type: Phaser.AUTO,
      width: 1280,
      height: 720,
      backgroundColor: "#0a0a12",
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: "arcade",
        arcade: { gravity: { y: 0 }, debug: false }
      },
      scene: [ScenePhase1, SceneGameOver]
    };
    let game = null;

    function alignSpinHintToCanvas() {
      const canvas = document.querySelector("canvas");
      const hint = document.getElementById("spin-hint");
      if (!canvas || !hint || hint.style.display === "none") return;
      const r = canvas.getBoundingClientRect();
      const s = Math.min(r.width / 1280, r.height / 720);
      // Centered over road (clearer read than foliage edge); below title/WASD rows
      const panelW = Math.min(620 * s, r.width - 24 * s);
      hint.style.width = `${panelW}px`;
      hint.style.maxWidth = `${panelW}px`;
      hint.style.left = `${r.left + (r.width - panelW) * 0.5}px`;
      hint.style.top = `${r.top + 100 * s}px`;
      hint.style.fontSize = `${Math.max(13, Math.round(15 * s))}px`;
      hint.style.padding = `${10 * s}px ${16 * s}px ${12 * s}px`;
    }

    let spinHintFadeTimerId = null;
    let spinHintHideTimerId = null;

    function scheduleSpinHintFade() {
      const hint = document.getElementById("spin-hint");
      if (!hint) return;
      if (spinHintFadeTimerId) clearTimeout(spinHintFadeTimerId);
      if (spinHintHideTimerId) clearTimeout(spinHintHideTimerId);
      spinHintFadeTimerId = setTimeout(() => {
        hint.style.transition = "opacity 2s";
        hint.style.opacity = "0";
        spinHintHideTimerId = setTimeout(() => {
          hint.style.display = "none";
          hint.style.animation = "none";
        }, 2000);
      }, 15000);
    }

    const startGame = () => {
      if (warningOverlay) warningOverlay.style.display = "none";
      if (!game) {
        game = new Phaser.Game(config);
        const hint = document.getElementById("spin-hint");
        if (hint) {
          hint.style.display = "block";
          hint.style.opacity = "1";
        }
        requestAnimationFrame(() => {
          alignSpinHintToCanvas();
          scheduleSpinHintFade();
        });
        window.addEventListener("resize", alignSpinHintToCanvas);
      }
    };

    window.addEventListener("keydown", (e) => {
      if (warningOverlay && warningOverlay.style.display !== "none" && e.code === "Enter") {
        startGame();
      }
    });
  </script>
</body>
</html>
